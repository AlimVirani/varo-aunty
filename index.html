<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Varo Aunty: a clickable demo of how a jamatkhana varo admin fills ceremony roles and what volunteers see.">
<meta name="theme-color" content="#FF7A1A">
<title>Varo Aunty</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Direction: 1960s jet-age optimism. Cream paper, tangerine, teal, mustard, avocado, space-black ink. Chunky ink outlines with hard offset shadows, capsule controls, mono label-maker tags. Righteous for titles only; Nunito for everything you read. */
:root{
  --paper:#FFF3DC; --surface:#FFFBF2; --surface-2:#F7E6C4; --ink:#1D2230; --fg:#1D2230; --muted:#6B6456; --line:#E3CFA6;
  --orange:#FF7A1A; --orange-deep:#D95A00; --teal:#0E9E8E; --mustard:#F5B82E; --cherry:#E6392E; --avocado:#5C9A2B;
  --accent:var(--orange); --accent-fg:#1D2230; --accent-soft:#FFE2C8;
  --warn:#8A5A00; --warn-soft:#FFE9A8; --danger:#B8261C; --danger-soft:#FFD9D2; --ok:#2F6B13; --ok-soft:#DDF2BC; --info:#0B6E63; --info-soft:#CDEFE9;
  --chrome:linear-gradient(160deg,#fafafa 0%,#c9ced4 35%,#eef0f2 55%,#9aa1a9 100%);
  --dots:rgba(29,34,48,.07);
  --font-body:'Nunito',system-ui,-apple-system,sans-serif; --font-display:'Righteous','Nunito',sans-serif; --font-mono:'Space Mono',ui-monospace,Menlo,monospace;
  --hard:3px 3px 0 var(--ink); --hard-sm:2px 2px 0 var(--ink); --shadow:0 18px 40px rgba(29,34,48,.22);
  --bg:var(--paper);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#14161C; --surface:#1C1F27; --surface-2:#262A34; --ink:#F2E9D6; --fg:#F2E9D6; --muted:#A79F8E; --line:#3A3E4A;
  --orange:#FF8A33; --orange-deep:#FFA45C; --teal:#2BC4B2; --mustard:#FFC94D; --cherry:#FF5A4E; --avocado:#8CCB52;
  --accent-fg:#14161C; --accent-soft:#4A2A12;
  --warn:#FFC94D; --warn-soft:#3E2E0C; --danger:#FF7A70; --danger-soft:#4A1C18; --ok:#9EDC5C; --ok-soft:#1F3A12; --info:#5FD6C6; --info-soft:#0F3A35;
  --dots:rgba(255,255,255,.05);
  --hard:3px 3px 0 #000; --hard-sm:2px 2px 0 #000; --shadow:0 18px 40px rgba(0,0,0,.55); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#14161C; --surface:#1C1F27; --surface-2:#262A34; --ink:#F2E9D6; --fg:#F2E9D6; --muted:#A79F8E; --line:#3A3E4A;
  --orange:#FF8A33; --orange-deep:#FFA45C; --teal:#2BC4B2; --mustard:#FFC94D; --cherry:#FF5A4E; --avocado:#8CCB52;
  --accent-fg:#14161C; --accent-soft:#4A2A12;
  --warn:#FFC94D; --warn-soft:#3E2E0C; --danger:#FF7A70; --danger-soft:#4A1C18; --ok:#9EDC5C; --ok-soft:#1F3A12; --info:#5FD6C6; --info-soft:#0F3A35;
  --dots:rgba(255,255,255,.05);
  --hard:3px 3px 0 #000; --hard-sm:2px 2px 0 #000; --shadow:0 18px 40px rgba(0,0,0,.55); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper) radial-gradient(var(--dots) 1px,transparent 1.2px) 0 0/14px 14px;color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
select,input,textarea{font:inherit;color:inherit;background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:6px 9px}
select{border-radius:999px;padding-right:12px}
textarea{width:100%;resize:vertical;border-radius:10px}
h1,h2{margin:0;font-family:var(--font-display);font-weight:400;text-wrap:balance;letter-spacing:.01em}
h3,h4{margin:0;font-weight:800;text-wrap:balance}
h1{font-size:26px} h2{font-size:24px} h3{font-size:16px} h4{font-size:14px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.topbar{background:var(--surface);border-bottom:3px solid var(--ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.stripe{height:7px;background:linear-gradient(90deg,var(--orange) 0 34%,var(--mustard) 34% 67%,var(--teal) 67%)}
.brand{display:flex;align-items:center;gap:8px}
.brand .star{display:inline-block;color:var(--orange);font-size:24px;line-height:1;text-shadow:2px 2px 0 var(--ink)}
.brand h1{color:var(--orange);text-shadow:2px 2px 0 var(--ink);-webkit-text-stroke:.6px var(--ink)}
.brand .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--mustard);color:#1D2230;border:2px solid var(--ink);font-weight:700;margin-left:6px}
.viewas{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.viewas label{font-size:12px;color:var(--muted);font-weight:700}
.topbar .spacer{flex:1}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;
  display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;max-width:1320px;margin:0 auto}
@media (max-width:980px){.wrap{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0}
.rail{min-width:0;display:flex;flex-direction:column;gap:14px}
@media (max-width:980px){.rail{order:-1}}

.card{background:var(--surface);border:2px solid var(--ink);border-radius:18px}
.card .hd{padding:12px 14px;border-bottom:2px dashed var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .bd{padding:12px 14px}

/* buttons: capsule, ink outline, press-down feel */
.btn{border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:700;line-height:1.3;transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translate(1px,1px)}
.btn.primary{background:var(--orange);border-color:var(--ink);color:#1D2230;box-shadow:var(--hard-sm)}
.btn.primary:hover{background:var(--orange-deep);color:#fff}
.btn.primary:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.resetbtn{background:var(--cherry);color:#fff;border-color:var(--ink);box-shadow:var(--hard-sm);font-weight:800;padding:7px 14px}
.resetbtn:hover{background:#c92b21;color:#fff}
.resetbtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.soundbtn{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* label-maker pills */
.pill{display:inline-block;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;line-height:1.5;white-space:nowrap;border:1.5px solid currentColor}
.pill.open{background:var(--danger-soft);color:var(--danger)}
.pill.req{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.adminonly{background:var(--surface-2);color:var(--muted);border-style:dashed}

/* segmented tabs */
.tabs{display:inline-flex;gap:2px;flex-wrap:wrap;background:var(--surface-2);border:2px solid var(--ink);border-radius:999px;padding:3px;margin:12px 14px 0}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:700}
.tabs button.on{color:var(--paper);background:var(--ink)}
.tabs button .cnt{font-family:var(--font-mono);font-size:10px;background:var(--mustard);color:#1D2230;padding:1px 6px;border-radius:999px;margin-left:5px}

/* roster grid */
.gridwrap{overflow-x:auto}
table.roster{border-collapse:separate;border-spacing:0 6px;min-width:640px;width:100%}
table.roster th,table.roster td{padding:5px 6px;vertical-align:top;text-align:left}
table.roster th{font-weight:700;font-size:12px;color:var(--muted);border-bottom:2px solid var(--ink);padding-bottom:8px}
table.roster th .sess{font-family:var(--font-display);font-size:17px;color:var(--fg);font-weight:400;letter-spacing:.01em}
table.roster td.role{font-weight:800;white-space:nowrap;width:110px;padding-top:12px}
.cell{position:relative;display:block;width:100%;text-align:left;border:2px solid var(--ink);background:var(--surface);border-radius:14px;padding:8px 10px;min-height:52px;box-shadow:var(--hard-sm);transition:transform .14s cubic-bezier(.34,1.56,.64,1),box-shadow .14s}
.cell:hover{transform:translate(-1px,-1px);box-shadow:var(--hard)}
.cell:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.cell.open{border-style:dashed;border-color:var(--cherry);background:var(--danger-soft);box-shadow:none}
.cell.open .nm{color:var(--danger);font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.cell.open:hover{box-shadow:none;transform:none;background:#ffcfc6}
.cell.wanted{border-color:var(--mustard);background:var(--warn-soft)}
.cell.wanted .nm{color:var(--warn);font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase} .cell.wanted .sub{color:var(--fg)}
.cell.assigned{background:var(--ok-soft);border-color:var(--avocado)}
.cell.assigned .nm::before{content:"✓ ";color:var(--ok)}
.cell.na{opacity:.35;border-style:dotted;cursor:default;background:transparent;box-shadow:none}
.cell .nm{font-weight:800}
.cell .sub{font-size:11px;color:var(--muted);display:block;margin-top:1px}
.cell.open .sub{color:var(--danger)}
.going{font-family:var(--font-mono);border:2px solid var(--ink);background:var(--teal);color:#fff;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;margin-top:6px;box-shadow:var(--hard-sm)}
.going:active{transform:translate(2px,2px);box-shadow:none}
.openct{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.searchbox{width:100%;padding:9px 14px;border-radius:999px;font-size:14px}

.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1.5px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .facts{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.row .badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.row input[type=checkbox]{margin-top:4px;width:18px;height:18px;accent-color:var(--orange)}
.sect{margin-top:14px}
.sect .eyebrow{margin-bottom:4px}

/* modal / panel */
.overlay{position:fixed;inset:0;background:rgba(29,34,48,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:700px){.overlay{align-items:center;padding:24px}}
.panel{background:var(--surface);width:100%;max-width:760px;max-height:92vh;overflow:auto;border:2px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.panel{border-radius:22px;border-bottom:2px solid var(--ink)}}
.panel .ph{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.panel .ph .grow{flex:1;min-width:0}
.preview{background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;white-space:pre-wrap}
.note{background:var(--info-soft);color:var(--info);border-radius:12px;padding:9px 12px;font-size:12px;border:1.5px solid currentColor}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.danger{background:var(--danger-soft);color:var(--danger)}
.composebox{border:2px solid var(--ink);border-radius:16px;padding:10px 12px;background:var(--surface);box-shadow:var(--hard)}
.askbox{background:var(--warn-soft);border:2px solid var(--mustard);border-radius:14px;padding:8px 12px}

/* phone */
.phonewrap{display:flex;justify-content:center}
.phoneshell{padding:7px;border-radius:42px;background:var(--chrome);box-shadow:var(--shadow);width:100%;max-width:400px}
.phone{width:100%;background:var(--surface);border:2px solid var(--ink);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;min-height:640px}
.phone .ptop{padding:14px 16px 10px;border-bottom:2px dashed var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phone .pbody{flex:1;padding:12px 14px;overflow:auto}
.phone .pnav{display:flex;border-top:2px solid var(--ink);background:var(--surface-2)}
.phone .pnav button{flex:1;border:0;background:none;padding:12px 4px 14px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.phone .pnav button.on{color:var(--orange)}
.phone .pnav button.on::after{content:"";position:absolute;left:30%;right:30%;bottom:6px;height:4px;border-radius:99px;background:var(--orange)}
.phone .pnav button .dot{position:absolute;top:8px;right:22%;width:8px;height:8px;border-radius:99px;background:var(--cherry);border:1.5px solid var(--surface-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--teal);border-color:var(--ink);color:#fff;box-shadow:var(--hard-sm)}
.chip.yes.on{background:var(--avocado);color:#fff}
.chip.no.on{background:var(--cherry);color:#fff}
.chip.unsure.on{background:var(--mustard);color:#1D2230}
.slotitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px dashed var(--line)}
.slotitem .grow{flex:1;min-width:0}
.sms{border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:9px 12px;margin-bottom:8px;font-size:13px;background:var(--surface)}
.sms.in{background:var(--accent-soft);border-radius:16px 16px 4px 16px}
.sms .meta{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-bottom:3px}
.sms .body{white-space:pre-wrap}
.daycard{border:2px solid var(--ink);border-radius:18px;margin-bottom:12px;background:var(--surface);box-shadow:var(--hard-sm)}
.daycard .bd{padding:12px 14px}
.daycard h3{font-family:var(--font-display);font-weight:400;font-size:20px}

/* rail */
.scen{border-top:2px dashed var(--line)}
.scen summary{cursor:pointer;padding:10px 14px;font-weight:800;list-style:none;display:flex;gap:10px;align-items:center}
.scen summary::-webkit-details-marker{display:none}
.scen summary .n{width:24px;height:24px;border-radius:99px;background:var(--orange);color:#1D2230;border:2px solid var(--ink);font-family:var(--font-mono);font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.scen .steps{padding:0 14px 12px}
.step{display:flex;gap:10px;padding:8px 0;border-top:1.5px dashed var(--line);align-items:flex-start}
.step .t{flex:1;min-width:0;font-size:13px}
.step .t .who{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.step .who.admin{color:var(--orange-deep)} .step .who.vol{color:var(--teal)} .step .who.auto{color:var(--warn)}
.step.done{opacity:.55}
.log{max-height:300px;overflow:auto;font-size:12px}
.log .ev{padding:6px 0;border-bottom:1.5px dashed var(--line);display:flex;gap:8px}
.log .ev:last-child{border-bottom:0}
.log .k{flex:none;width:62px;font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.log .k.admin{color:var(--orange-deep)} .log .k.vol{color:var(--teal)} .log .k.auto{color:var(--warn)} .log .k.text{color:var(--danger)}
.log .at{font-family:var(--font-mono);font-size:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:30;box-shadow:4px 4px 0 var(--orange);max-width:90vw;border:2px solid var(--paper);outline:2px solid var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted);font-weight:700} .kv dd{margin:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.col h4{margin-bottom:6px}
.col ul{list-style:none;margin:0;padding:0;font-size:13px}
.col li{padding:3px 0;border-bottom:1px solid var(--line)}

/* fun */
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.toast{animation:toastin .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
.pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg) scale(1.04)}60%{transform:rotate(3deg) scale(1.04)}}
.wiggle{animation:wiggle .45s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .3s ease-in-out}
@keyframes stampin{0%{opacity:0;transform:rotate(-16deg) scale(2.4)}70%{opacity:1;transform:rotate(-8deg) scale(.94)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
.stamp{position:absolute;right:6px;bottom:5px;font-family:var(--font-mono);font-weight:700;font-size:9px;letter-spacing:.16em;color:var(--ok);border:2px solid var(--ok);border-radius:4px;padding:1px 5px;background:var(--surface);transform:rotate(-8deg);animation:stampin .5s cubic-bezier(.34,1.56,.64,1) both;pointer-events:none}
.confetti{position:fixed;width:8px;height:12px;z-index:50;pointer-events:none;border-radius:2px}
.plane{position:fixed;z-index:60;font-size:22px;pointer-events:none;color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideup{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
.panel{animation:slideup .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes flashok{0%{background:var(--avocado)}100%{background:var(--ok-soft)}}
.cell.assigned.flash{animation:flashok .9s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
// ---------- fixed vocabulary ----------
const TEMPLATES = {
  'Thursday': ['First dua','Tasbih','Ginan','Firman','Second dua'],
  'Friday':   ['First dua','Tasbih','Ginan','Firman','Gatpat dua'],
};
const ALL_ROLES = ['First dua','Tasbih','Ginan','Firman','Second dua','Gatpat dua'];

// ---------- demo data (all made up) ----------
function seedPeople(){
  const P = (id,name,g,age,phone,can,last,count90,usually,extra={})=>Object.assign({id,name,g,age,phone,can,last,count90,usually,declines:0,noreply:0,noshows:0,credit:0,away:null,notes:'',reply:'yes'},extra);
  return [

  const notes={tap:[[880,.06]],send:[[520,.07],[780,.1]],yes:[[660,.08],[990,.16]],no:[[320,.12],[230,.18]],confirm:[[523,.08],[659,.08],[784,.1],[1046,.2]],reset:[[420,.08],[300,.08],[210,.14]]}[kind]||[[700,.06]];

function haptic(pattern){ try{ if(navigator.vibrate){ navigator.vibrate(pattern); return; }

  let l=document.getElementById('hapticlbl'); if(!l){ const i=document.createElement('input'); i.type='checkbox'; i.setAttribute('switch',''); i.id='hapticsw'; i.tabIndex=-1; l=document.createElement('label'); l.id='hapticlbl'; l.htmlFor='hapticsw'; [i,l].forEach(x=>Object.assign(x.style,{position:'fixed',left:'-9999px',top:'0'})); document.body.append(i,l); } l.click(); }catch(e){} }
function afterRender(fn){ FX.queue.push(fn); }
function runFx(){ const q=FX.queue; FX.queue=[]; if(!q.length) return; const go=()=>q.forEach(f=>{try{f()}catch(e){}}); (typeof requestAnimationFrame==='function')?requestAnimationFrame(go):go(); }

    const ang=Math.random()*Math.PI*2, dist=70+Math.random()*130; const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-80;
    const a=d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy+160}px) rotate(${Math.random()*720-360}deg)`,opacity:0}],{duration:900+Math.random()*600,easing:'cubic-bezier(.2,.7,.3,1)'}); a.onfinish=()=>d.remove(); } }
function flyPlane(from,toSel){ afterRender(()=>{ if(FX.rm||!from) return; const toEl=document.querySelector(toSel); const b=toEl?toEl.getBoundingClientRect():{left:innerWidth-60,top:20,width:0,height:0};

// ---------- derived facts ----------
function attendanceOf(sid,pid){ return (state.attendance[sid]||{})[pid]||null; }
function likely(sid,pid){ const s=session(sid), p=person(pid); return !attendanceOf(sid,pid) && p.usually.includes(s.dow); }
function assignedElsewhere(sid,pid,role){ return session(sid).slots.filter(s=>s.assigned===pid && s.role!==role).map(s=>s.role); }
function requestsFor(sid,role){ return state.requests.filter(r=>r.status==='open' && r.role===role && (r.session===sid || r.type==='standing')); }
function openSlotsForRole(role){ const out=[]; state.sessions.forEach(s=>s.slots.forEach(sl=>{ if(sl.role===role && !sl.assigned) out.push({sid:s.id,label:s.label,role}); })); return out; }
function weeksAgo(p,role){ const w=p.last[role]; return w==null? null : w; }
function facts(p,sid,role){
  const f=[];
  f.push(`${p.g} · ${p.age}`);
  const w=weeksAgo(p,role); f.push(w==null? `never done ${role}` : `last ${role} ${w} wk ago`);
  f.push(`${p.count90} in 90d`);
  if(p.usually.length) f.push('usually '+p.usually.join('/'));
  if(p.declines) f.push(`${p.declines} declines`);
  if(p.noreply) f.push(`${p.noreply} no-reply`);
  if(p.credit) f.push(`${p.credit} said yes, not used`);
  return f;
}
function badges(p,sid,role){
  const b=[]; const req=requestsFor(sid,role).find(r=>r.pid===p.id);
  if(req) b.push(`<span class="pill req">${req.type==='standing'?'Wants it':'Requested this'}</span>`);
  const a=attendanceOf(sid,p.id);
  if(a==='yes') b.push('<span class="pill ok">Coming</span>'); else if(a==='no') b.push('<span class="pill open">Not coming</span>'); else if(a==='unsure') b.push('<span class="pill neutral">Not sure</span>'); else if(likely(sid,p.id)) b.push('<span class="pill info">Likely</span>');
  if(weeksAgo(p,role)==null && p.can.includes(role)) b.push('<span class="pill info">First time</span>');
  if(!p.can.includes(role)) b.push('<span class="pill neutral">Not on their list</span>');
  if(p.away) b.push(`<span class="pill open">${esc(p.away)}</span>`);
  if(!p.phone) b.push('<span class="pill neutral">No phone · call</span>');
  const el=assignedElsewhere(sid,p.id,role); if(el.length) b.push(`<span class="pill neutral">Also on ${esc(el.join(', '))}</span>`);
  return b.join(' ');
}
function shortlist(sid,role){
  const reqs=requestsFor(sid,role).map(r=>r.pid);
  const elig=state.people.filter(p=>p.can.includes(role)||reqs.includes(p.id));
  const score=p=>{
    let s=0; if(reqs.includes(p.id)) s+=1000;
    const a=attendanceOf(sid,p.id); if(a==='yes') s+=300; else if(a==='no') s-=500; else if(likely(sid,p.id)) s+=150;
    if(p.away) s-=800;
    const w=weeksAgo(p,role); s+= (w==null? 60 : Math.min(w,30)*4);
    s-= p.count90*25; s-= p.declines*40; s-= p.noreply*20; s+= p.credit*60;
    if(assignedElsewhere(sid,p.id,role).length) s-=120;
    return s;
  };
  return elig.sort((a,b)=>score(b)-score(a));
}

function sendText(pid,body,kind,meta={}){ state.texts.unshift({id:uid(),to:pid,dir:'out',body,kind,at:now(),meta,answered:false}); logEv('text',`Text to ${person(pid).name}: ${kind}`); }

function addRequest(pid,type,role,sid,note){ haptic(8); blip('tap'); if(sid) popSel(`[data-key="${sid}|${role}"]`);

}
function askText(p,role,sid){ return `Salaam {first}, this is Shamim from JK. Could you do ${role} on ${session(sid).label} (${session(sid).time})? Reply YES or NO.`; }
function fill(body,p){ return body.replace(/\{first\}/g,p.name.split(' ')[0]); }
function sendAsks(sid,role,pids,kind='ask',body){ blip('send'); haptic(12);
  const sl=slot(sid,role);
  pids.forEach(pid=>{ const p=person(pid); if(!p.phone){ logEv('admin',`${p.name} has no phone. Marked "call her" instead of texting.`); sl.asks.push({pid,state:'call'}); return; }
    if(sl.asks.some(a=>a.pid===pid&&a.state==='asked')) return;
    sl.asks.push({pid,state:'asked'}); sendText(pid,fill(body||askText(p,role,sid),p),kind,{sid,role}); scheduleReply(sid,role,pid); });
  logEv('admin',`Admin texted ${pids.filter(x=>person(x).phone).length} ${pids.length===1?'person':'people'} about ${role} ${session(sid).label}.`);
}
function sendCustom(pids,body){ blip('send'); haptic(12); pids.forEach(pid=>{ const p=person(pid); if(p.phone) sendText(pid,fill(body,p),'message',{}); }); logEv('admin',`Admin sent a custom message to ${pids.map(x=>person(x).name).join(', ')}.`); }
function nextSameDay(sid){ const s=session(sid); return state.sessions.find(x=>x.dow===s.dow && state.sessions.indexOf(x)>state.sessions.indexOf(s)); }
function templatesFor(sid,role,pids){
  const s=session(sid); const t=[];
  t.push({label:`Ask for ${role} on ${s.label}`,target:{sid,role},body:askText(person(pids[0]),role,sid)});
  const n=nextSameDay(sid); if(n && !slot(n.id,role).assigned) t.push({label:`Ask for ${role} next ${s.dow} instead`,target:{sid:n.id,role},body:`Salaam {first}, this is Shamim. ${s.label} is covered. Could you do ${role} on ${n.label} instead? Reply YES or NO.`});
  s.slots.filter(x=>!x.assigned&&x.role!==role).forEach(x=>t.push({label:`Ask for ${x.role} instead, same night`,target:{sid,role:x.role},body:`Salaam {first}, this is Shamim. Could you do ${x.role} instead on ${s.label}? Reply YES or NO.`}));

function scheduleReply(sid,role,pid){
  const p=person(pid); if(p.reply==='silent') return;
  const t=setTimeout(()=>{ applyReply(sid,role,pid,p.reply); render(); },2500+Math.random()*3500); timers.push(t);
}
function applyReply(sid,role,pid,ans){
  const sl=slot(sid,role); const a=sl.asks.find(x=>x.pid===pid&&x.state==='asked'); if(!a) return;
  a.state=ans; const p=person(pid);

  inboundText(pid,ans==='yes'?'YES':'NO, sorry','reply',{sid,role});
  if(ans==='no') p.declines++;
  blip(ans==='yes'?'yes':'no'); popSel(cellSel(sid,role),ans==='yes'?'wiggle':'shake');

function markNoReply(sid,role){ slot(sid,role).asks.filter(a=>a.state==='asked').forEach(a=>{a.state='noreply'; person(a.pid).noreply++;}); logEv('auto',`Unanswered asks for ${role} ${session(sid).label} marked "no reply". Nothing was sent.`); }
function assign(sid,role,pid,withText,rect){ celebrate(rect,sid,role);

  if(withText && person(pid).phone) sendText(pid,`Confirmed: ${role} on ${session(sid).label}, ${session(sid).time}. Please be there 15 minutes early. Reply if anything changes.`,'confirmation',{sid,role});
  const yesOthers=sl.asks.filter(x=>x.state==='yes'&&x.pid!==pid).map(x=>x.pid);
  const askedIds=sl.asks.map(x=>x.pid);
  const reqOthers=requestsFor(sid,role).map(r=>r.pid).filter(x=>x!==pid&&!askedIds.includes(x));

function release(sid,role,pid,choice,target){ blip('send'); haptic(10);

  if(ui.release){ ui.release.pids=ui.release.pids.filter(x=>x!==pid); if(!ui.release.pids.length) ui.release=null; }
}
function markDropped(sid,role){ const sl=slot(sid,role); if(!sl.assigned) return; blip('no'); popSel(cellSel(sid,role),'shake'); const p=person(sl.assigned); sl.dropped.push(sl.assigned); sl.assigned=null; sl.asks=[]; logEv('admin',`${p.name} dropped ${role} ${session(sid).label}. Slot reopened. Nobody texted yet.`); }
function remindOne(sid,role){ const s=session(sid), sl=slot(sid,role); if(!sl.assigned) return; const p=person(sl.assigned); if(!p.phone){ toast(p.name+' has no phone. Call her.'); return; } blip('send'); haptic(10); sendText(sl.assigned,`Reminder: you're doing ${role} on ${s.label}, ${s.time}. Reply if anything changed.`,'reminder',{sid,role}); sl.reminded=true; logEv('admin',`Admin reminded ${p.name} about ${role} ${s.label}.`); toast('Reminder sent to '+p.name); }
function sendReminders(sid){ const s=session(sid); let n=0; blip('send'); haptic(10); s.slots.forEach(sl=>{ if(sl.assigned&&person(sl.assigned).phone&&!sl.reminded){ sendText(sl.assigned,`Reminder: you're doing ${sl.role} on ${s.label}, ${s.time}. Reply if anything changed.`,'reminder',{sid,role:sl.role}); sl.reminded=true; n++; } }); logEv('admin',`Admin sent ${n} reminders for ${s.label}.`); toast(`${n} reminder${n===1?'':'s'} sent`); }
function volunteerReply(textId,ans){ const t=state.texts.find(x=>x.id===textId); if(!t||t.answered) return; haptic(10); blip(ans==='yes'?'yes':'no'); t.answered=true; const {sid,role}=t.meta; const sl=slot(sid,role); const a=sl.asks.find(x=>x.pid===t.to&&x.state==='asked'); if(a){ a.state=ans; if(ans==='no') person(t.to).declines++; } inboundText(t.to,ans==='yes'?'YES':'NO, sorry','reply',{sid,role}); logEv('vol',`${person(t.to).name} replied ${ans.toUpperCase()} to ${role} ${session(sid).label}.`); }
function declineRequest(rid){ const r=state.requests.find(x=>x.id===rid); r.status='declined'; logEv('admin',`Admin declined ${person(r.pid).name}'s request for ${r.role}. No text sent unless admin writes one.`); }

  const app=document.getElementById('app');
  app.innerHTML = renderTopbar() + `<div class="wrap"><div class="stage">${ui.view==='admin'?renderAdmin():renderPhone()}</div><div class="rail">${renderRail()}</div></div>` + (ui.panel?renderSlotPanel():'') + (ui.person?renderPersonPanel():'');
  runFx();
}
function renderTopbar(){
  const opts=['<option value="admin"'+(ui.view==='admin'?' selected':'')+'>Varo Aunty desk · Shamim (admin)</option>']

// ----- admin -----
function renderAdmin(){
  const tabs=[['roster','Calendar'],['people','People'],['texts','Texts sent']];
  if(!['roster','people','texts'].includes(ui.adminTab)) ui.adminTab='roster';
  return `<div class="card">
    <div class="tabs">${tabs.map(([k,l])=>`<button data-action="adminTab" data-tab="${k}" class="${ui.adminTab===k?'on':''}">${l}${k==='texts'?`<span class="cnt" style="background:var(--surface-2);color:var(--muted)">${state.texts.filter(t=>t.dir==='out').length}</span>`:''}</button>`).join('')}</div>
    <div class="bd">${({roster:renderRoster,people:renderPeople,texts:renderTexts})[ui.adminTab]()}</div>
  </div>` + (ui.sessionPanel?renderSessionPanel():'');
}
function renderRoster(){
  const roles=ALL_ROLES.filter(r=>state.sessions.some(s=>s.slots.some(sl=>sl.role===r)));
  const head=state.sessions.map(s=>{ const open=s.slots.filter(x=>!x.assigned).length; const going=state.people.filter(p=>attendanceOf(s.id,p.id)==='yes').length; return `<th><span class="sess">${esc(s.label)}</span><br><span>${esc(s.template)} · ${esc(s.time)}</span><br><span class="openct ${open?'':'muted'}" style="${open?'color:var(--danger)':''}">${open?open+' open':'all set'}</span><br><button class="going" data-action="openSession" data-sid="${s.id}">${going} going</button></th>`; }).join('');
  const mark={asked:'…',yes:'✓',no:'✗',noreply:'–',chosen:'✓',released:'·',call:'☎'};
  const rows=roles.map(role=>`<tr><td class="role">${esc(role)}</td>${state.sessions.map(s=>{ const sl=s.slots.find(x=>x.role===role); if(!sl) return '<td><span class="cell na"></span></td>';
    const reqs=requestsFor(s.id,role);
    if(sl.assigned){ const p=person(sl.assigned); return `<td><button class="cell assigned" data-action="openSlot" data-sid="${s.id}" data-role="${esc(role)}"><span class="nm">${esc(p.name)}</span><span class="sub">confirmed${sl.reminded?' · reminded ✓':''}${sl.standby?' · backup '+esc(person(sl.standby).name.split(' ')[0]):''}</span></button></td>`; }
    const live=sl.asks.filter(a=>['asked','yes','no','noreply','call'].includes(a.state));
    const lines=[];
    if(reqs.length) lines.push(`${reqs.map(r=>esc(person(r.pid).name.split(' ')[0])).join(', ')} want${reqs.length===1?'s':''} it`);
    if(live.length) lines.push('Texted: '+live.map(a=>esc(person(a.pid).name.split(' ')[0])+' '+mark[a.state]).join(', '));
    if(sl.dropped.length) lines.push(esc(person(sl.dropped[sl.dropped.length-1]).name.split(' ')[0])+' dropped');
    const cls=(reqs.length||live.length)?'wanted':'open';
    return `<td><button class="cell ${cls}" data-action="openSlot" data-sid="${s.id}" data-role="${esc(role)}"><span class="nm">${cls==='wanted'?'In progress':'Open'}</span><span class="sub">${lines.join('<br>')||'no one asked yet · tap to pick'}</span></button></td>`; }).join('')}</tr>`).join('');
  return `<p class="muted small" style="margin-bottom:10px">Everything starts here. Tap a cell to see who could do it, text a few people, and confirm one. Tap a going count to see who said they're coming.</p>
    <div class="gridwrap"><table class="roster"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="legend" style="margin-top:10px"><span><span class="pill open">Red</span> open, nobody asked</span><span><span class="pill req">Yellow</span> someone wants it or has been texted (✓ yes · … waiting · ✗ no)</span><span><span class="pill ok">Green</span> confirmed by admin</span></div>
    <div class="btnrow" style="margin-top:10px">${state.sessions.map(s=>{const n=s.slots.filter(x=>x.assigned&&person(x.assigned).phone&&!x.reminded).length; return `<button class="btn sm" data-action="reminders" data-sid="${s.id}" ${n?'':'disabled'}>Remind everyone on ${esc(s.label)} (${n})</button>`;}).join('')}</div>`;
}

  return `<div class="overlay" data-action="closeSession"><div class="panel" data-stop="1">

}
function renderPeople(){
  const rows=state.people.map(p=>`<div class="row"><div class="grow"><div><strong>${esc(p.name)}</strong> <span class="muted small">${p.g} · ${p.age}${p.phone?'':' · no phone'}${p.phone&&HOUSEHOLDS[p.phone].includes('+')?' · shared phone':''}</span></div>

    <div class="facts"><span>${p.count90} in 90d</span><span>${p.declines} declines</span><span>${p.noreply} no-reply</span><span>${p.noshows} no-shows</span>${p.credit?`<span>${p.credit} said yes, not used</span>`:''}${p.away?`<span style="color:var(--danger)">${esc(p.away)}</span>`:''}</div>

function renderTexts(){
  const out=state.texts.filter(t=>t.dir==='out'); const n=out.length;

  return `<div class="note danger"><strong>${n} text${n===1?'':'s'} sent in this demo.</strong> Every one went out because an admin pressed a button. The app has no scheduled texts, no automatic reminders, no automatic broadcasts.</div><div style="margin-top:10px">${items||'<p class="muted small">Nothing sent yet.</p>'}</div>`;
}

// ----- slot panel -----
function renderSlotPanel(){
  const {sid,role}=ui.panel; const s=session(sid), sl=slot(sid,role);
  const list=shortlist(sid,role);
  const reqs=requestsFor(sid,role).map(r=>r.pid);
  const asked=sl.asks; const askedIds=asked.map(a=>a.pid);
  const sections=[
    ['Raised their hand', list.filter(p=>reqs.includes(p.id)&&!askedIds.includes(p.id))],
    ['Coming and can do it', list.filter(p=>!reqs.includes(p.id)&&!askedIds.includes(p.id)&&(attendanceOf(sid,p.id)==='yes'||likely(sid,p.id))&&!p.away)],
    ['Everyone else eligible', list.filter(p=>!reqs.includes(p.id)&&!askedIds.includes(p.id)&&!(attendanceOf(sid,p.id)==='yes'||likely(sid,p.id)&&!p.away))],
  ];
  const q=ui.search.trim().toLowerCase();
  const matches=p=>!q||p.name.toLowerCase().includes(q);
  if(q){ sections.forEach(sec=>sec[1]=sec[1].filter(matches)); const inAny=new Set(sections.flatMap(sec=>sec[1].map(p=>p.id))); const others=state.people.filter(p=>matches(p)&&!inAny.has(p.id)&&!askedIds.includes(p.id)); if(others.length) sections.push(['Not marked for this role, but you can still text them',others]); }
  const sel=Object.keys(ui.selected).filter(k=>ui.selected[k]);
  const personRow=(p,withCheck)=>`<div class="row">${withCheck&&p.phone&&!sl.assigned?`<input type="checkbox" id="sel_${p.id}" data-check="${p.id}" ${ui.selected[p.id]?'checked':''} aria-label="select ${esc(p.name)}">`:'<span style="width:16px"></span>'}
    <div class="grow"><div><strong>${esc(p.name)}</strong></div><div class="facts">${facts(p,sid,role).map(esc).join(' · ')}</div><div class="badges">${badges(p,sid,role)}</div></div>
    <div class="btnrow" style="flex-direction:column;align-items:stretch;gap:4px">
    ${!sl.assigned&&reqs.includes(p.id)?`<button class="btn sm primary" data-action="assignAsk" data-sid="${sid}" data-role="${esc(role)}" data-pid="${p.id}">Confirm</button>`:''}
    ${!sl.assigned&&!p.phone?`<button class="btn sm" data-action="assignAsk" data-sid="${sid}" data-role="${esc(role)}" data-pid="${p.id}">Assign (called)</button>`:''}
    ${p.phone?`<button class="btn sm" data-action="textOne" data-sid="${sid}" data-role="${esc(role)}" data-pid="${p.id}">Text</button>`:''}</div></div>`;
  let top='';
  if(sl.assigned){ const p=person(sl.assigned); top=`<div class="note" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span><strong>${esc(p.name)}</strong> is confirmed.${sl.reminded?' Reminder sent ✓.':''}${sl.standby?` Backup: ${esc(person(sl.standby).name)}.`:''}</span><span class="spacer" style="flex:1"></span>
      <button class="btn sm ${sl.reminded?'':'primary'}" data-action="remind" data-sid="${sid}" data-role="${esc(role)}">${sl.reminded?'Remind again':'Text a reminder'}</button>
      ${p.phone?`<button class="btn sm" data-action="textOne" data-sid="${sid}" data-role="${esc(role)}" data-pid="${p.id}" data-custom="1">Custom text</button>`:''}
      <button class="btn sm danger" data-action="drop" data-sid="${sid}" data-role="${esc(role)}">Mark dropped</button></div>`; }
  else if(sl.dropped.length){ top=`<div class="note danger">${esc(person(sl.dropped[sl.dropped.length-1]).name)} dropped this. Open again. Nobody has been texted.</div>`; }
  if(!sl.assigned&&reqs.length>1){ top+=`<div class="note warn" style="margin-top:8px"><strong>${reqs.length} people want this slot:</strong> ${reqs.map(pid=>esc(person(pid).name)).join(', ')}. Confirm one, and you will be asked what to tell the others.</div>`; }
  let askBlock='';

    const lbl={asked:'<span class="pill neutral">Waiting</span>',yes:'<span class="pill ok">Said YES</span>',no:'<span class="pill open">Said no</span>',noreply:'<span class="pill neutral">No reply</span>',chosen:'<span class="pill ok">Assigned</span>',released:'<span class="pill neutral">Released</span>',call:'<span class="pill neutral">To call</span>'};
    askBlock=`<div class="sect askbox"><div class="eyebrow" style="color:var(--warn)">You texted (${asked.length})</div>${asked.map(a=>{const p=person(a.pid); return `<div class="row"><span style="width:16px"></span><div class="grow"><div><strong>${esc(p.name)}</strong> ${lbl[a.state]}</div><div class="facts">${facts(p,sid,role).map(esc).join(' · ')}</div></div>

      ${a.state==='call'&&!sl.assigned?`<button class="btn sm" data-action="assignAsk" data-sid="${sid}" data-role="${esc(role)}" data-pid="${p.id}">Assign (called)</button>`:''}</div>`;}).join('')}

    <div class="ph"><div class="grow"><div class="eyebrow">${esc(s.label)} · ${esc(s.time)} · ${esc(s.template)}</div><h2>${esc(role)}</h2></div><button class="btn sm" data-action="closePanel">Close</button></div>
    ${top}${askBlock}${releaseBlock}
    ${!sl.assigned?`<div style="margin-top:12px;position:sticky;top:0;background:var(--surface);padding:6px 0;z-index:1;display:grid;gap:8px"><input class="searchbox" id="slotsearch" data-search="1" placeholder="Search any name…" value="${esc(ui.search)}" autocomplete="off"><div class="btnrow"><button class="btn primary" data-action="compose" data-sid="${sid}" data-role="${esc(role)}" ${canAsk?'':'disabled'}>Text selected (${sel.length})</button><span class="small muted">Tick people, then text them all at once.</span></div></div>`:''}
    ${compose}
    ${sections.map(([t,arr])=>`<div class="sect"><div class="eyebrow">${t} (${arr.length})</div>${arr.map(p=>personRow(p,true)).join('')||'<p class="muted small">Nobody.</p>'}</div>`).join('')}
    <p class="tiny muted" style="margin-top:12px">Order: raised a hand first, then coming that night, then longest since they last did this, fewest in the last 90 days, and "said yes, not used" credit. Declines and no-replies push down. The admin always picks.</p>
  </div></div>`;
}
function renderPersonPanel(){
  const p=person(ui.person);
  return `<div class="overlay" data-action="closePerson"><div class="panel" data-stop="1"><div class="ph"><div class="grow"><div class="eyebrow">Person · admin view</div><h2>${esc(p.name)}</h2></div><button class="btn sm" data-action="closePerson">Close</button></div>
    <dl class="kv"><dt>Profile</dt><dd>${p.g} · ${p.age} · ${p.phone?esc(HOUSEHOLDS[p.phone]):'no phone, call'}</dd><dt>Does</dt><dd>${esc(p.can.join(', ')||'—')}</dd><dt>Usually attends</dt><dd>${esc(p.usually.join(', ')||'—')}</dd><dt>Last did</dt><dd>${Object.entries(p.last).map(([r,w])=>`${esc(r)} ${w} wk ago`).join(' · ')||'nothing yet'}</dd><dt>Last 90 days</dt><dd>${p.count90} varos · ${p.declines} declines · ${p.noreply} no-reply · ${p.noshows} no-shows · ${p.credit} said yes, not used</dd>${p.away?`<dt>Away</dt><dd>${esc(p.away)}</dd>`:''}</dl>
    <div class="sect"><label class="eyebrow" for="notes_${p.id}">Admin-only notes</label><textarea id="notes_${p.id}" data-notes="${p.id}" rows="3">${esc(p.notes)}</textarea><p class="tiny muted">Saved as you type. Never shown to the volunteer.</p></div></div></div>`;
}

// ----- phone -----
function renderPhone(){
  const members=state.people.filter(p=>p.phone===ui.view);
  if(!ui.actingAs||!members.some(m=>m.id===ui.actingAs)) ui.actingAs=members[0].id;
  const me=person(ui.actingAs);
  const unread=state.texts.filter(t=>t.to===me.id&&t.dir==='out'&&!t.answered&&(t.kind==='ask'||t.kind==='broadcast'||t.kind==='redirect')).length;
  const tabs=[['home','Calendar'],['texts','Texts'],['me','Me']];
  if(!['home','texts','me'].includes(ui.volTab)) ui.volTab='home';
  return `<div class="phonewrap"><div class="phoneshell"><div class="phone">
    <div class="ptop"><div class="grow" style="flex:1"><div class="eyebrow">${esc(HOUSEHOLDS[ui.view])}</div>${members.length>1?`<div class="chips" style="margin-top:4px">${members.map(m=>`<button class="chip ${m.id===ui.actingAs?'on':''}" data-action="actAs" data-pid="${m.id}">${esc(m.name.split(' ')[0])}</button>`).join('')}</div>`:`<strong>${esc(me.name)}</strong>`}</div></div>
    <div class="pbody">${({home:renderVolHome,texts:renderVolTexts,me:renderVolMe})[ui.volTab](me,members)}</div>
    <div class="pnav">${tabs.map(([k,l])=>`<button data-action="volTab" data-tab="${k}" class="${ui.volTab===k?'on':''}">${l}${k==='texts'&&unread?'<span class="dot"></span>':''}</button>`).join('')}</div>
  </div></div></div>`;
}
function renderVolHome(me,members){
  const days=state.sessions.map(s=>{
    const att=attendanceOf(s.id,me.id);
    const checkin=`<div class="chips" style="margin:6px 0 4px">${[['yes','Going'],['unsure','Not sure'],['no','Not going']].map(([v,l])=>`<button class="chip ${v} ${att===v?'on':''}" data-action="att" data-sid="${s.id}" data-pid="${me.id}" data-val="${v}">${l}</button>`).join('')}</div>`;
    const slots=s.slots.map(sl=>{
      const req=state.requests.find(r=>r.status==='open'&&r.pid===me.id&&r.role===sl.role&&r.session===s.id);
      const ask=sl.asks.find(a=>a.pid===me.id&&a.state==='asked');
      let right;
      if(sl.assigned===me.id) right=`<span class="pill ok" data-key="${s.id}|${sl.role}">You · confirmed</span>`;
      else if(sl.assigned) right='<span class="pill neutral">Full</span>';
      else if(sl.standby===me.id) right='<span class="pill info">You are backup</span>';
      else if(req) right=`<span class="pill req" data-key="${s.id}|${sl.role}">Requested</span>`;
      else if(ask) right='<span class="pill info">Admin asked you · see Texts</span>';
      else right=`<button class="btn sm ${me.can.includes(sl.role)?'primary':''}" data-action="ican" data-sid="${s.id}" data-role="${esc(sl.role)}" data-pid="${me.id}">Request</button>`;
      return `<div class="slotitem"><div class="grow">${esc(sl.role)}${!sl.assigned&&!me.can.includes(sl.role)&&!req?'<span class="tiny muted"> · not on your list</span>':''}</div>${right}</div>`; }).join('');
    return `<div class="daycard"><div class="bd"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h3>${esc(s.label)}</h3><span class="muted small">${esc(s.template)} · ${esc(s.time)}</span></div>${checkin}${slots}</div></div>`; }).join('');
  const standing=state.requests.filter(r=>r.pid===me.id&&r.status==='open'&&r.type==='standing').map(r=>`<div class="slotitem"><div class="grow">${esc(r.role)} <span class="muted small">any time soon</span></div><span class="pill req">Requested</span></div>`).join('');
  return `<p class="tiny muted" style="margin-bottom:8px">${members.length>1?`Checking in as <strong>${esc(me.name.split(' ')[0])}</strong>. `:''}Tap Going so the admin knows you'll be there. Tap Request on an open varo; the admin confirms, and the slot shows Full once someone is confirmed.</p>
    ${days}
    <div class="sect" style="margin-top:4px"><div class="eyebrow">No date in mind?</div>${standing}<div class="btnrow" style="margin-top:6px"><select id="req_role">${ALL_ROLES.map(r=>`<option>${r}</option>`).join('')}</select><button class="btn sm" data-action="submitReq" data-pid="${me.id}">Ask for it sometime soon</button></div></div>`;
}
function renderVolTexts(me){
  const mine=state.texts.filter(t=>t.to===me.id);
  return (mine.map(t=>`<div class="sms ${t.dir==='in'?'':'in'}" style="${t.dir==='in'?'background:var(--surface-2);margin-left:40px':''}"><div class="meta">${t.dir==='out'?'JK varo admin':'You'} · ${t.at}</div><div class="body">${esc(t.body)}</div>${t.dir==='out'&&!t.answered&&['ask','broadcast','redirect'].includes(t.kind)?`<div class="btnrow" style="margin-top:8px"><button class="btn sm primary" data-action="reply" data-tid="${t.id}" data-ans="yes">Yes, I can</button><button class="btn sm" data-action="reply" data-tid="${t.id}" data-ans="no">No, sorry</button></div>`:''}</div>`).join('')||'<p class="muted small">No texts yet. The admin only texts you when they want you for something specific.</p>');
}
function renderVolMe(me){
  const rolesList=ALL_ROLES.map(r=>`<div class="slotitem"><div class="grow">${esc(r)}${me.can.includes(r)&&me.last[r]==null?'<span class="tiny muted"> · not done yet</span>':''}</div><button class="chip ${me.can.includes(r)?'on':''}" data-action="toggleCan" data-pid="${me.id}" data-role="${esc(r)}">${me.can.includes(r)?'I do this':'Add'}</button></div>`).join('');
  return `<div class="eyebrow">${esc(me.name)}</div><p class="small muted" style="margin:2px 0 8px">${me.g} · ${me.age}</p><div class="eyebrow">Varos I do</div><p class="tiny muted">Tick the ones you're willing to do, including ones you'd like to start. The admin sees this list.</p>${rolesList}
    <div class="sect"><div class="eyebrow">Away</div><div class="btnrow" style="margin-top:4px"><button class="chip ${me.away?'on':''}" data-action="toggleAway" data-pid="${me.id}">${me.away?esc(me.away):'Mark me away this month'}</button></div><p class="tiny muted">The admin sees this so they stop asking while you are away.</p></div>`;
}

// ----- rail -----
function renderRail(){
  const scen=SCENARIOS.map((sc,i)=>{ const done=state.scenarioDone[sc.id]||0; return `<details class="scen" ${i===0?'open':''}><summary><span class="n">${i+1}</span>${esc(sc.title)}</summary><div class="steps"><p class="small muted" style="margin-bottom:4px">${esc(sc.intro)}</p>${sc.steps.map((st,j)=>`<div class="step ${j<done?'done':''}"><div class="t"><div class="who ${st.who}">${st.who==='admin'?'Admin':st.who==='vol'?'Volunteer':'Happens'}</div>${esc(st.text)}</div><button class="btn sm ${j===done?'primary':''}" data-action="step" data-sc="${sc.id}" data-i="${j}" ${j===done?'':'disabled'}>${j<done?'Done':'Play'}</button></div>`).join('')}</div></details>`; }).join('');
  const log=state.log.map(e=>`<div class="ev"><span class="k ${e.kind}">${e.kind==='vol'?'volunteer':e.kind==='text'?'text sent':e.kind}</span><span>${esc(e.text)} <span class="muted at">${e.at}</span></span></div>`).join('');
  return `<div class="card"><div class="hd"><h3>Try a story</h3><span class="muted small">Press Play on each step, or skip these and click around.</span></div>${scen}</div>
    <div class="card"><div class="hd"><h3>What just happened</h3></div><div class="bd log">${log}</div></div>
    <div class="card"><div class="bd small muted"><strong style="color:var(--fg)">Ground rules this demo follows.</strong> The admin approves every assignment. The app never sends a text on its own. Volunteers check in for a day and request open varos; the admin sees it and decides whom to confirm or text. Volunteers see only open, full, and their own. Declines, no-shows and notes stay on the admin desk.</div></div>`;
}

// ---------- events ----------
document.getElementById('app').addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  if(e.target.closest('[data-stop]') && ['closePanel','closePerson','closeSession'].includes(el.dataset.action) && !e.target.closest('button')) return;
  const d=el.dataset; const a=d.action; const rect=el.getBoundingClientRect?el.getBoundingClientRect():null;
  switch(a){
    case 'reset': blip('reset'); haptic(10); popSel('.brand .star','spin'); reset(); return;
    case 'sound': FX.sound=!FX.sound; if(FX.sound) blip('tap'); break;
    case 'adminTab': ui.adminTab=d.tab; break;
    case 'volTab': ui.volTab=d.tab; break;
    case 'actAs': ui.actingAs=d.pid; break;
    case 'openSlot': ui.panel={sid:d.sid,role:d.role}; ui.selected={}; ui.compose=null; ui.search=''; break;
    case 'openSession': ui.sessionPanel=d.sid; break;
    case 'closeSession': ui.sessionPanel=null; break;
    case 'closePanel': ui.panel=null; ui.compose=null; ui.selected={}; ui.search=''; break;
    case 'openPerson': ui.person=d.pid; break;
    case 'closePerson': ui.person=null; break;
    case 'compose': { const pids=Object.keys(ui.selected).filter(k=>ui.selected[k]); const t=templatesFor(ui.panel.sid,ui.panel.role,pids)[0]; ui.compose={pids,tplIdx:0,body:t.body,target:t.target}; break; }
    case 'textOne': { const tpls=templatesFor(d.sid,d.role,[d.pid]); const i=d.custom?tpls.length-1:0; ui.compose={pids:[d.pid],tplIdx:i,body:tpls[i].body,target:tpls[i].target}; break; }
    case 'tpl': { const t=templatesFor(ui.panel.sid,ui.panel.role,ui.compose.pids)[+d.i]; ui.compose.tplIdx=+d.i; ui.compose.body=t.body; ui.compose.target=t.target; break; }
    case 'cancelCompose': ui.compose=null; break;
    case 'sendCompose': { const c=ui.compose; if(c.target) sendAsks(c.target.sid,c.target.role,c.pids,'ask',c.body); else sendCustom(c.pids,c.body); ui.compose=null; ui.selected={}; flyPlane(rect,'[data-tab="texts"]'); toast(c.target?'Sent ✈ Replies will show up on that slot.':'Message sent ✈'); break; }
    case 'remind': remindOne(d.sid,d.role); flyPlane(rect,'[data-tab="texts"]'); break;
    case 'assignAsk': assign(d.sid,d.role,d.pid,true,rect); toast(person(d.pid).name+' confirmed ✓ text sent'); break;
    case 'release': { const s=document.getElementById('rel_'+d.pid); const v=s?s.value:'thanks'; if(v.startsWith('redirect:')) release(d.sid,d.role,d.pid,'redirect',v.slice(9)); else release(d.sid,d.role,d.pid,v); break; }
    case 'drop': markDropped(d.sid,d.role); ui.selected={}; break;
    case 'flush': flushReplies(); break;
    case 'noreply': markNoReply(d.sid,d.role); blip('no'); break;
    case 'reminders': sendReminders(d.sid); flyPlane(rect,'[data-tab="texts"]'); break;
    case 'declineReq': declineRequest(d.rid); break;
    case 'att': setAttendance(d.sid,d.pid,d.val); break;
    case 'ican': addRequest(d.pid,'slot',d.role,d.sid,''); toast('Requested. The admin will confirm. No text goes out.'); break;
    case 'submitReq': { const role=document.getElementById('req_role').value; addRequest(d.pid,'standing',role,null,''); toast('Request sent to the admin'); break; }
    case 'reply': volunteerReply(d.tid,d.ans); break;
    case 'toggleCan': { const p=person(d.pid); const i=p.can.indexOf(d.role); i>=0?p.can.splice(i,1):p.can.push(d.role); blip('tap'); haptic(8); logEv('vol',`${p.name} updated profile: does ${p.can.join(', ')||'nothing'}.`); break; }
    case 'toggleAway': { const p=person(d.pid); p.away=p.away?null:'Away this month'; logEv('vol',`${p.name} ${p.away?'marked away':'is back'}.`); break; }
    case 'step': { const sc=SCENARIOS.find(x=>x.id===d.sc); const i=+d.i; blip('tap'); sc.steps[i].run(); state.scenarioDone[sc.id]=i+1; break; }
  }
  render();
});
document.getElementById('app').addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.change==='viewas'){ ui.view=el.value; ui.panel=null; ui.person=null; ui.sessionPanel=null; ui.compose=null; ui.selected={}; if(ui.view!=='admin') ui.actingAs=null; render(); }
  else if(el.dataset.check){ ui.selected[el.dataset.check]=el.checked; render(); }
});
document.getElementById('app').addEventListener('input',e=>{ const el=e.target;
  if(el.dataset.notes){ person(el.dataset.notes).notes=el.value; }
  else if(el.dataset.composebody){ if(ui.compose) ui.compose.body=el.value; }
  else if(el.dataset.search){ ui.search=el.value; render(); const i=document.getElementById('slotsearch'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }
});

reset();
</script>
</body>
</html>
